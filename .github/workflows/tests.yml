# CI — suite rapide (83 tests) à chaque push/PR sur main.
# Les tests marqués `slow` (entraînements PPO réels) et `network` (yfinance)
# sont exclus : la CI doit rester déterministe et < 5 min.
name: tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  fast-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      MPLBACKEND: Agg
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Installer les dépendances
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Suite rapide (sans slow ni network)
        run: python -m pytest -m "not slow and not network" -q
